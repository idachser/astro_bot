services:
  astro-bot:
    build: .
    container_name: astro-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB: data/astrobase.db
      LOGGING_FILE: data/astrobot.log
      # skyevents runs on its own compose, reachable by service name over
      # the shared external `astronet` bridge (no host port). Create the
      # network once on the host: `docker network create astronet`.
      SKYEVENTS_URL: http://skyevents:8000
    volumes:
      - ./data:/app/data
    networks:
      - astronet

networks:
  astronet:
    external: true
